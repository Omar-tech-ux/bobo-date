name: Deploy Bobo's app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://mkokgytybuencwkilpbh.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_M8AbVr1SZRt0Ndz7EG2jyQ_50_30D0S
      VITE_VAPID_PUBLIC_KEY: BD3oW-_wtv2V2CvgNyra4addO7qRcU032ev37vPLdJonN7VeHtMdXIQPGqbCu5p7qkFktEdjaMMOdSe1Ehr7OuU
    steps:
      - name: Check out the app
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the app
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
